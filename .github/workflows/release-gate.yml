name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run quality contract
        shell: bash
        run: |
          set -o pipefail
          npm run verify:quality 2>&1 | tee quality.log
      - name: Upload quality log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-${{ github.sha }}
          path: quality.log
          retention-days: 7
          if-no-files-found: error

  e2e-chromium:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:chromium
      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
      - name: Upload Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium-failure-${{ github.sha }}
          path: |
            test-results/
            tests/e2e/__screenshots__/visual-regression.spec.ts/windows-ci/
          retention-days: 7
          if-no-files-found: error

  e2e-webkit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:e2e:webkit
      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-failure-${{ github.sha }}
          path: |
            test-results/
            tests/e2e/__screenshots__/visual-regression.spec.ts/windows-ci/
          retention-days: 7
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    env:
      VITE_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_REWARDED_AD_GROUP_ID }}
      VITE_BANNER_AD_GROUP_ID: ${{ secrets.VITE_BANNER_AD_GROUP_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build Apps in Toss artifact
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Verify Apps in Toss artifact exists
        shell: bash
        run: test -f geuttae-yojeum.ait
      - name: Upload Apps in Toss build
        uses: actions/upload-artifact@v7
        with:
          name: geuttae-yojeum-ait-${{ github.sha }}
          path: geuttae-yojeum.ait
          retention-days: 7
          if-no-files-found: error
      - name: Upload Apps in Toss build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geuttae-yojeum-build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
          if-no-files-found: error
